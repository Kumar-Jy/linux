name: pkgbuild

# Build the kernel package for the branch selected when running the workflow.

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload the built package to a GitHub Release (tag includes kernel version)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.ref_name }} (${{ matrix.distro }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, ubuntu, fedora]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve package info
        id: pkg
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" != *"7.3"* && "$ref" != *"73"* ]]; then
            echo "ERROR: branch '$ref' is not supported by this workflow (7.3 only)" >&2
            exit 1
          fi
          if [[ "$ref" == *"sm8150"* ]]; then
            package="linux-sm8150-73"
            defconfig="sm8150_defconfig"
          else
            package="linux-nabu-73"
            defconfig="nabu_defconfig"
          fi
          pkgver=$(grep -m1 '^pkgver=' "packages/$package/PKGBUILD" | cut -d= -f2- | tr -d '"')
          pkgrel=$(grep -m1 '^pkgrel=' "packages/$package/PKGBUILD" | cut -d= -f2- | tr -d '"')
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "defconfig=$defconfig" >> "$GITHUB_OUTPUT"
          echo "version=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Install tools (Arch)
        if: matrix.distro == 'arch'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build package (Arch)
        if: matrix.distro == 'arch'
        run: |
          package="${{ steps.pkg.outputs.package }}"
          mkdir -p pkg-out /tmp/arch-work
          cp -r "packages/$package/"* /tmp/arch-work/
          sed -i "s|git+https://github.com/[^\"]*|git+file:///src#commit=${{ github.sha }}|" /tmp/arch-work/PKGBUILD
          echo "::group::Building $package (Arch, commit ${{ github.sha }})..."
          podman run --rm \
            -v "$(pwd):/src:ro" \
            -v "/tmp/arch-work:/work" \
            -v "$(pwd)/pkg-out:/output" \
            -w /work \
            menci/archlinuxarm:base \
            bash -c '
              set -euo pipefail
              sed -i "/^#DisableSandbox/s/^#//" /etc/pacman.conf
              echo "DisableSandbox" >> /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel git bc python3 xmlto docbook-xsl kmod inetutils dtc systemd-ukify libelf
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              git config --system --add safe.directory "*"
              sed -i "s/#MAKEFLAGS=.*/MAKEFLAGS=\"-j\$(nproc)\"/" /etc/makepkg.conf
              grep -q "^MAKEFLAGS=" /etc/makepkg.conf || echo "MAKEFLAGS=\"-j\$(nproc)\"" >> /etc/makepkg.conf
              sed -i "s/COMPRESSZST=.*/COMPRESSZST=(zstd -c -z -q --threads=0 -)/" /etc/makepkg.conf
              sed -i "s/COMPRESSXZ=.*/COMPRESSXZ=(xz -c -z - --threads=0)/" /etc/makepkg.conf
              chown -R builder:builder /work
              su builder -c "cd /work && export MAKEFLAGS=\"-j\$(nproc)\" && makepkg -s --noconfirm --skipchecksums"
              cp -v /work/*.pkg.tar.* /output/
              chmod -R a+rw /output /work 2>/dev/null || true
            '
          echo "::endgroup::"
          ls -la pkg-out/

      - name: Install build tools (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev debhelper dpkg-dev device-tree-compiler kmod cpio rsync

      - name: Build package (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          branch="${{ github.ref_name }}"
          version="${{ steps.pkg.outputs.version }}"
          mkdir -p pkg-out
          echo "::group::Building .deb (Ubuntu, branch $branch)..."
          export DTC_FLAGS="-@"
          export LOCALVERSION=""
          defconfig="${{ steps.pkg.outputs.defconfig }}"
          make ARCH=arm64 "$defconfig"
          make ARCH=arm64 LOCALVERSION="" -j$(nproc) Image Image.gz modules dtbs
          make ARCH=arm64 LOCALVERSION="" DPKG_FLAGS="-d" KDEB_PKGVERSION="$version" -j$(nproc) bindeb-pkg
          find .. -maxdepth 1 -name "*.deb" -exec mv -v {} pkg-out/ \;
          sudo chmod -R a+r pkg-out/
          echo "::endgroup::"
          ls -la pkg-out/

      - name: Install tools (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build package (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          mkdir -p pkg-out
          echo "::group::Building .rpm (Fedora)..."
          podman run --rm \
            -v "$(pwd):/work" \
            -v "$(pwd)/pkg-out:/output" \
            -w /work \
            fedora:latest \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory /work 2>/dev/null || true
              dnf install -y --setopt=install_weak_deps=False --skip-unavailable \
                gcc make bc bison flex openssl openssl-devel perl perl-devel \
                elfutils-libelf-devel elfutils-devel dwarves \
                dtc rpm-build kmod cpio git rsync diffutils findutils tar hostname python3 binutils
              export KBUILD_BUILD_USER=builder
              export KBUILD_BUILD_HOST=fedora-build
              export DTC_FLAGS="-@"
              export LOCALVERSION=""
              defconfig="${{ steps.pkg.outputs.defconfig }}"
          make ARCH=arm64 "$defconfig"
              make ARCH=arm64 LOCALVERSION="" -j$(nproc) Image Image.gz modules dtbs
              make ARCH=arm64 LOCALVERSION="" RPMOPTS="--nodeps" -j$(nproc) binrpm-pkg
              mkdir -p /output
              find rpmbuild/RPMS -name "*.rpm" -exec cp -v {} /output/ \; 2>/dev/null || true
              find / -name "kernel-*.rpm" -exec cp -v {} /output/ \; 2>/dev/null || true
              chmod -R a+rw /output /work 2>/dev/null || true
            '
          echo "::endgroup::"
          ls -la pkg-out/

      - name: Upload ${{ matrix.distro }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ steps.pkg.outputs.package }}-${{ steps.pkg.outputs.version }}-${{ matrix.distro }}
          path: pkg-out/*
          if-no-files-found: error

  release:
    name: Release ${{ github.ref_name }}
    if: ${{ inputs.upload_release == true }}
    needs: build
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Create / update GitHub Release
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          repo="${{ github.repository }}"

          package="linux-nabu-73"
          pkgver=$(grep -m1 '^pkgver=' "packages/$package/PKGBUILD" | cut -d= -f2- | tr -d '"')
          pkgrel=$(grep -m1 '^pkgrel=' "packages/$package/PKGBUILD" | cut -d= -f2- | tr -d '"')
          if [ -z "$pkgver" ] || [ -z "$pkgrel" ]; then
            echo "ERROR: could not read pkgver/pkgrel from packages/$package/PKGBUILD" >&2
            exit 1
          fi

          safe_branch="${branch//\//-}"
          if [ "$branch" = "7.3" ] || [ "$branch" = "nabu/7.3.y" ]; then
            tag="v${pkgver}-${pkgrel}"
          else
            tag="v${pkgver}-${pkgrel}-${safe_branch}"
          fi
          if [[ "$branch" == *"sm8150"* ]]; then
            title="Linux SM8150 ${pkgver}-${pkgrel}"
          else
            title="Linux Nabu ${pkgver}-${pkgrel}"
          fi

          export PKGVER="$pkgver"
          export PKGREL="$pkgrel"
          export BRANCH="$branch"
          export SHA="${{ github.sha }}"

          python3 << 'EOF'
          import glob
          import inspect
          import os
          import zipfile

          pkgver = os.environ['PKGVER']
          pkgrel = os.environ['PKGREL']
          branch = os.environ['BRANCH']
          sha = os.environ['SHA']

          os.makedirs('release-assets', exist_ok=True)

          distro_files = {}
          for distro in ['arch', 'ubuntu', 'fedora']:
              dirs = glob.glob(f'pkg-*-{distro}')
              if not dirs:
                  print(f'::warning::Directory for {distro} not found')
                  distro_files[distro] = []
                  continue

              d = dirs[0]
              files = sorted([f for f in os.listdir(d) if os.path.isfile(os.path.join(d, f)) and not f.startswith('.')])
              distro_files[distro] = files

              pkg_prefix = 'linux-sm8150' if 'sm8150' in branch else 'linux-nabu'
              zip_name = f'{pkg_prefix}-{pkgver}-{pkgrel}-{distro}.zip'
              zip_path = os.path.join('release-assets', zip_name)
              print(f'Compressing {len(files)} files into {zip_name}...')
              with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for fname in files:
                      zf.write(os.path.join(d, fname), arcname=fname)

          def fmt_files(flist):
              return '<br>'.join(f'`{f}`' for f in flist) if flist else '*None*'

          target_title = 'SM8150' if 'sm8150' in branch else 'Nabu'
          target_desc = 'Qualcomm Snapdragon 855 / 855+ / 860 (SM8150) devices' if 'sm8150' in branch else 'the **Xiaomi Pad 5 (nabu)**'

          if 'sm8150' in branch:
              hw_support = """### ✨ Universal SM8150 Hardware Support Built-in
          - **SoC Architecture:** Qualcomm Snapdragon 855 / 855+ / 860 (SM8150) unified mainline baseline (`sm8150_defconfig`)
          - **Graphics & Display:** Adreno 640 GPU (Turnip Vulkan 1.3 / Freedreno OpenGL 4.6) & MSM DRM KMS
          - **Hardware Video Acceleration:** Qualcomm Iris VPU hardware video decode (H.264/HEVC/VP9) & encode
          - **Audio & DSP:** Hexagon QDSP6 audio APR services, SLIMbus & native soundwire/codec interfaces
          - **Storage:** Inline crypto engine (UFS ICE) bypass & gear-tuned link training
          - **Sensors & Compute:** Snapdragon SLPI FastRPC sensor island with high-IOVA SMMU translation
          - **Power Management:** PSCI cpuidle deep suspend (s2idle), RPMh power domains & PM8150 / PM8150B / PM8150L PMICs
          - **Supported Platforms:** Xiaomi Pad 5 (nabu), Microsoft Surface Duo, Sony Xperia 1/5 (Kumano), Qualcomm HDK855 / MTP"""
          else:
              hw_support = """### ✨ Hardware Support Built-in
          - **Display & Touch:** 2.5K WQHD+ 120Hz Novatek NT36523 DSI panel + 10-point multi-touch & Xiaomi Smart Pen
          - **Audio:** Cirrus Logic quad CS35L41 stereo smart amplifiers & WCD9340 24-bit mic capture
          - **Video & Graphics:** Adreno 640 GPU 3D acceleration & Iris VPU hardware video decoding
          - **Charging & Battery:** PM8150B SMB5 charger driver (15W USB-PD / DCP) & Renesas IDTP9418 wireless stylus charging
          - **Sensors:** Snapdragon SLPI FastRPC sensor island (accelerometer, gyroscope, ambient light sensor)
          - **Power Management:** Deep sleep (s2idle suspend/resume) & Bluetooth sleep IRQ isolation
          - **Peripherals:** Official Xiaomi magnetic keyboard cover (DWC3 secondary USB host) & cover lid hall sensor"""

          notes = f"""## Linux {target_title} Kernel {pkgver}-{pkgrel}

          Mainline Linux kernel build for {target_desc} with full hardware support across **Arch Linux ARM**, **Ubuntu**, and **Fedora**.

          - **Kernel Version:** `{pkgver}` (release `{pkgrel}`)
          - **Branch:** `{branch}`
          - **Commit:** `{sha}`

          ---

          ### 📦 Distribution Packages

          | Distribution | Package Archive | Included Files |
          | :--- | :--- | :--- |
          | **Arch Linux ARM** | `{pkg_prefix}-{pkgver}-{pkgrel}-arch.zip` | {fmt_files(distro_files.get('arch', []))} |
          | **Ubuntu (ARM64)** | `{pkg_prefix}-{pkgver}-{pkgrel}-ubuntu.zip` | {fmt_files(distro_files.get('ubuntu', []))} |
          | **Fedora (ARM64)** | `{pkg_prefix}-{pkgver}-{pkgrel}-fedora.zip` | {fmt_files(distro_files.get('fedora', []))} |

          ---

          ### 🚀 Quick Install Instructions

          #### Arch Linux ARM
          ```bash
          unzip {pkg_prefix}-{pkgver}-{pkgrel}-arch.zip -d {pkg_prefix}
          cd {pkg_prefix} && sudo pacman -U *.pkg.tar.*
          ```

          #### Ubuntu / Debian (ARM64)
          ```bash
          unzip {pkg_prefix}-{pkgver}-{pkgrel}-ubuntu.zip -d {pkg_prefix}
          cd {pkg_prefix} && sudo dpkg -i *.deb
          ```

          #### Fedora (ARM64)
          ```bash
          unzip {pkg_prefix}-{pkgver}-{pkgrel}-fedora.zip -d {pkg_prefix}
          cd {pkg_prefix} && sudo dnf install ./*.rpm
          ```

          ---

          {hw_support}
          """

          notes = inspect.cleandoc(notes)
          with open('release-notes.md', 'w') as f:
              f.write(notes + '\n')
          EOF

          shopt -s nullglob
          zips=(release-assets/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "ERROR: no zip files found under release-assets/" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "::group::Release $tag exists - cleaning loose assets and updating"
            loose_assets=$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[] | select(.name | endswith(".zip") | not) | .name' 2>/dev/null || true)
            for asset in $loose_assets; do
              echo "Deleting loose asset: $asset"
              gh release delete-asset "$tag" "$asset" --repo "$repo" --yes 2>/dev/null || true
            done
            gh release upload "$tag" --repo "$repo" --clobber "${zips[@]}"
            gh release edit "$tag" --repo "$repo" --title "$title" --notes-file release-notes.md
            echo "::endgroup::"
          else
            echo "::group::Creating release $tag"
            gh release create "$tag" --repo "$repo" --title "$title" --notes-file release-notes.md "${zips[@]}"
            echo "::endgroup::"
          fi
          gh release view "$tag" --repo "$repo" --json name,url --jq '"[name=\(.name)] url: \(.url)"'
