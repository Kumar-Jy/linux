%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/maxim,ds28e16-xiaomi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim DS28E16 battery authenticator on Xiaomi devices

maintainers:
  - TwinbornPlate75 <3342733415@qq.com>

description: |
  The DS28E16 is a 1-Wire secure authenticator used by Xiaomi to authenticate
  battery packs before enabling high-current and switched-capacitor charging.
  Xiaomi nabu contains one authenticator for each half of its dual battery.

  The downstream implementation accesses Qualcomm TLMM direction and data
  registers directly because generic GPIO operations do not provide stable
  enough sub-microsecond timing.  The GPIO is nevertheless requested through
  gpiolib for ownership and pinctrl configuration.

properties:
  compatible:
    const: maxim,ds28e16-xiaomi

  gpios:
    maxItems: 1
    description: 1-Wire data GPIO.

  maxim,auth-role:
    $ref: /schemas/types.yaml#/definitions/string
    enum: [ primary, secondary ]
    description: Identifies which battery-half authenticator this node owns.

  maxim,gpio-config-address:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Physical address of the Qualcomm TLMM GPIO configuration register.

  maxim,gpio-io-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 4
    maximum: 4096
    description: Offset from the configuration register to the GPIO input/output register.

  pinctrl-names:
    items:
      - const: default

  pinctrl-0: true

required:
  - compatible
  - gpios
  - maxim,auth-role
  - maxim,gpio-config-address
  - maxim,gpio-io-offset
  - pinctrl-names
  - pinctrl-0

additionalProperties: false

examples:
  - |
    battery-auth-primary {
        compatible = "maxim,ds28e16-xiaomi";
        gpios = <&tlmm 5 0>;
        maxim,auth-role = "primary";
        maxim,gpio-config-address = <0x03d05000>;
        maxim,gpio-io-offset = <4>;
        pinctrl-names = "default";
        pinctrl-0 = <&ds28e16_primary_default>;
    };
